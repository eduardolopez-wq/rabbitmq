# Configuración para ambiente PRE
# Desplegar con: shopify app deploy --config shopify.app.pre.toml
# Desarrollo local:  shopify app dev --config shopify.app.pre.toml

client_id = "b3b6cb985336f7b5de028569ecb6ab26"
name = "rabbitmq-portal"
application_url = "https://rabbitmqportal.vivofacil.org"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "/webhooks/customers/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

[access_scopes]
# Requeridos para webhooks de clientes, Admin API y metacampos con acceso a cuenta de cliente
scopes = "write_metaobject_definitions,write_metaobjects,write_products,read_customers,write_customers,customer_read_customers,customer_write_customers,read_orders"

[auth]
redirect_urls = [ "https://rabbitmqportal.vivofacil.org/auth/callback" ]

[customer.metafields.app.dast_public_id]
type = "single_line_text_field"
name = "DAST Public ID"

  [customer.metafields.app.dast_public_id.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.dast_document_type]
type = "number_integer"
name = "DAST Document Type"

  [customer.metafields.app.dast_document_type.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.dast_gender]
type = "number_integer"
name = "DAST Gender"

  [customer.metafields.app.dast_gender.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.dast_birth_date]
type = "date"
name = "DAST Birth Date"

  [customer.metafields.app.dast_birth_date.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.dast_telephone]
type = "single_line_text_field"
name = "DAST Telephone"

  [customer.metafields.app.dast_telephone.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.dast_country_code]
type = "single_line_text_field"
name = "DAST Country Code"

  [customer.metafields.app.dast_country_code.access]
  admin = "merchant_read_write"
  customer_account = "read_write"
