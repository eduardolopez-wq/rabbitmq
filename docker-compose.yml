version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq.json:/etc/rabbitmq/definitions.json
    environment:
      RABBITMQ_DEFAULT_USER: desarrollo
      RABBITMQ_DEFAULT_PASS: desarrollo
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:
        >
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
